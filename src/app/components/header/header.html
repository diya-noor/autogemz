<!-- header begin -->
<header class="transparent">
  <div id="topbar">
    <div class="container">
      <div class="row">
        <div class="col-lg-12">
          <div class="d-flex justify-content-between xs-hide">
            <div class="d-flex">
              <div class="topbar-widget">
                <a href="https://maps.app.goo.gl/CWuAeq29tEPBoNZn6" target="_blank">
                  <img src="images/svg-white/bell.svg" class="" alt="">
                  Civic Center Behria Town Phase 4, Rawalpindi
                </a>
              </div>
            </div>
            <div class="d-flex">
              <div class="topbar-widget me-5">
                <a href="tel:+923341111167">
                  <img src="images/svg-white/phone.svg" class="" alt="">Call us +92 334 1111 167
                </a>
              </div>
              <div class="topbar-widget">
                <a href="mailto:info@autogemz.com">
                  <img src="images/svg-white/envelope.svg" class="" alt="">Message us: info@autogemz.com
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="clearfix"></div>
    </div>
  </div>

  <div class="container">
    <div class="row">
      <div class="col-md-12">
        <div class="de-flex sm-pt10">
          <div class="de-flex-col">
            <div id="logo">
              <a routerLink="/">
                <img class="logo-main" src="images/auto-gems-logo.png" alt="" style="height: 150px;">
                <img class="logo-mobile" src="images/mobile.png" alt="" style="height: 50px;">
              </a>
            </div>
          </div>
          <div class="de-flex-col header-col-mid">
            <ul id="mainmenu">
              <li><a class="menu-item" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Home</a></li>
              <li>
                <a class="menu-item">Services</a>
                <ul>
                  <li><a routerLink="/car-import">Car Import</a></li>
                  <li><a routerLink="/car-inspection">Car Inspection</a></li>
                  <li><a routerLink="/car-documentation">Car Documentation</a></li>
                  <li><a routerLink="/investment-opportunity">Investment Opportunity</a></li>
                </ul>
              </li>
              <li><a class="menu-item" routerLink="/inventory" routerLinkActive="active">Inventory</a></li>
              <li><a class="menu-item" routerLink="/about" routerLinkActive="active">About Us</a></li>
              <li><a class="menu-item" routerLink="/contact" routerLinkActive="active">Contact</a></li>
            </ul>
          </div>
          <div class="de-flex-col">
            <div class="menu_side_area">
              <a routerLink="/appointment" class="btn-main fx-slide hover-white"><span>Make Appointment</span></a>
              <span id="menu-btn"></span>
            </div>
            <div id="btn-extra">
              <span></span>
              <span></span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</header>
<!-- header end -->
